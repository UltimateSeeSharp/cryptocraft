name: Build RandomX

# Builds librandomx from the pinned upstream tag and uploads one artifact per platform.
# Run manually; commit each download to miner/src/main/resources/native/<platform>/.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'tevador/RandomX tag to build'
        required: true
        default: 'v1.2.3'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x86_64
            name: randomx.dll
          - os: ubuntu-22.04
            artifact: linux-x86_64
            name: librandomx.so
          - os: macos-13
            artifact: macos-x86_64
            name: librandomx.dylib
          - os: macos-14
            artifact: macos-aarch64
            name: librandomx.dylib

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout RandomX
        uses: actions/checkout@v4
        with:
          repository: tevador/RandomX
          ref: ${{ inputs.tag }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: cmake --build build --config Release

      # The upstream test binary over the official vectors. If this fails the binary is
      # not worth shipping. Located by search: multi-config generators (MSVC) emit into
      # build/Release, single-config ones into build.
      - name: Verify
        shell: bash
        run: |
          tests=$(find build -name 'randomx-tests' -o -name 'randomx-tests.exe' | head -1)
          if [ -z "$tests" ]; then
            echo "::error::randomx-tests not found under build/"; find build -maxdepth 2; exit 1
          fi
          echo "Running $tests"
          "$tests"

      - name: Stage
        shell: bash
        run: |
          lib=$(find build -name '${{ matrix.name }}' | head -1)
          if [ -z "$lib" ]; then
            echo "::error::${{ matrix.name }} not found under build/"; find build -maxdepth 2; exit 1
          fi
          mkdir -p out
          cp "$lib" "out/${{ matrix.name }}"
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: librandomx-${{ matrix.artifact }}
          path: out/${{ matrix.name }}
          if-no-files-found: error

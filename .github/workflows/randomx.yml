name: Build RandomX

# Builds librandomx for every supported platform from the pinned upstream tag, verifies
# each one, and opens a pull request placing them under miner/src/main/resources/native/.
# The binaries only ever enter the repo this way — never from a local build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'tevador/RandomX tag to build'
        required: true
        default: 'v1.2.3'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x86_64
            name: randomx.dll
          # Built inside Debian 12 so the .so needs only glibc 2.36 and loads on every
          # still-supported Linux (Ubuntu 22.04+, Debian 12+, Fedora, Arch). The runner
          # stays current; only the toolchain inside the container is old. Debian 12 is
          # supported to 2028 — bump it, not the runner, to move the compatibility floor.
          - os: ubuntu-latest
            container: debian:12
            artifact: linux-x86_64
            name: librandomx.so
          # macos-13 was retired in Dec 2025. macos-15-intel is the last x86_64 macOS
          # image and goes away in Aug 2027; after that, Apple Silicon only.
          - os: macos-15-intel
            artifact: macos-x86_64
            name: librandomx.dylib
          - os: macos-15
            artifact: macos-aarch64
            name: librandomx.dylib

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # The Debian container is bare: no compiler, cmake, git or python.
      - name: Install build tools
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3 ca-certificates
          ln -sf /usr/bin/python3 /usr/bin/python
          # checkout clones as a different uid than the container user.
          git config --global --add safe.directory '*'

      - name: Checkout RandomX
        uses: actions/checkout@v4
        with:
          repository: tevador/RandomX
          ref: ${{ inputs.tag }}
          path: randomx

      # This repo, for the wrapper CMake project and helper scripts.
      - name: Checkout CryptoCraft scripts
        uses: actions/checkout@v4
        with:
          path: .cryptocraft
          sparse-checkout: |
            .github/scripts
            .github/randomx-shared
          sparse-checkout-cone-mode: false

      # Built through a wrapper project that sets WINDOWS_EXPORT_ALL_SYMBOLS on the target.
      # Upstream's RANDOMX_EXPORT is empty and its cmake_minimum_required(3.10) stops the
      # CMAKE_-prefixed variable from initialising the property, so MSVC otherwise exports
      # nothing: no import library, and a DLL the binding cannot resolve symbols in.
      # RANDOMX_SOURCE_DIR is resolved from the working directory, not github.workspace,
      # which expands to the host path and does not exist inside a container.
      - name: Configure
        shell: bash
        run: >
          cmake
          -S .cryptocraft/.github/randomx-shared
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DRANDOMX_SOURCE_DIR="$PWD/randomx"

      - name: Build
        run: cmake --build build --config Release

      # Without this a later failure only says "no files found", hiding which step broke.
      - name: Show build output
        if: always()
        shell: bash
        run: |
          echo "--- working directory ---"; pwd; ls -la
          echo "--- build tree (2 levels) ---"; find build -maxdepth 2 2>/dev/null || echo "no build/"
          echo "--- libraries and executables ---"
          find build \( -name 'librandomx*' -o -name 'randomx*.dll' -o -name 'randomx-tests*' \) 2>/dev/null || true

      - name: Stage
        shell: bash
        run: |
          lib=$(find build -name '${{ matrix.name }}' | head -1)
          if [ -z "$lib" ]; then
            echo "::error::${{ matrix.name }} not found under build/"; find build -maxdepth 2; exit 1
          fi
          mkdir -p out
          cp "$lib" "out/${{ matrix.name }}"
          ls -l out/

      # The binding resolves these by name, so a library that builds but exports nothing
      # would fail only at runtime. MSVC in particular emits no exports unless asked.
      - name: Check exported symbols
        shell: bash
        run: |
          lib="out/${{ matrix.name }}"
          case "${{ runner.os }}" in
            Windows) python .cryptocraft/.github/scripts/pe_exports.py "$lib" > symbols.txt ;;
            macOS)   nm -gU "$lib" > symbols.txt ;;
            *)       nm -D --defined-only "$lib" > symbols.txt ;;
          esac
          missing=0
          for fn in randomx_get_flags randomx_alloc_cache randomx_init_cache \
                    randomx_release_cache randomx_alloc_dataset randomx_dataset_item_count \
                    randomx_init_dataset randomx_release_dataset randomx_create_vm \
                    randomx_destroy_vm randomx_calculate_hash; do
            grep -q "$fn" symbols.txt || { echo "::error::missing export $fn"; missing=1; }
          done
          if [ "$missing" -eq 0 ]; then echo "All 11 required symbols exported."; fi
          exit $missing

      # Upstream's own test binary over the official vectors. Runs after the artifact is
      # staged, so a linking problem here still leaves a usable library to download.
      - name: Verify against upstream vectors
        shell: bash
        run: |
          tests=$(find build \( -name 'randomx-tests' -o -name 'randomx-tests.exe' \) | head -1)
          if [ -z "$tests" ]; then
            echo "::error::randomx-tests not found under build/"; find build -maxdepth 2; exit 1
          fi
          # Windows resolves the DLL from the executable's own directory.
          cp "out/${{ matrix.name }}" "$(dirname "$tests")/" 2>/dev/null || true
          echo "Running $tests"
          "$tests"

      # Shipped next to the binary so its origin is recoverable from the repo alone.
      - name: Record provenance
        shell: bash
        run: |
          # sha256sum is coreutils; macOS ships shasum instead.
          if command -v sha256sum >/dev/null; then
            digest=$(sha256sum "out/${{ matrix.name }}" | cut -d' ' -f1)
          else
            digest=$(shasum -a 256 "out/${{ matrix.name }}" | cut -d' ' -f1)
          fi
          commit=$(git -C randomx rev-parse HEAD)
          cat > out/PROVENANCE.txt <<EOF
          source:    https://github.com/tevador/RandomX
          tag:       ${{ inputs.tag }}
          commit:    $commit
          platform:  ${{ matrix.artifact }}
          runner:    ${{ matrix.os }}${{ matrix.container && format(' (container {0})', matrix.container) || '' }}
          built:     $(date -u +%Y-%m-%dT%H:%M:%SZ)
          run:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          checks:    all 11 required symbols exported; upstream randomx-tests passed
          sha256:    $digest
          EOF
          cat out/PROVENANCE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: librandomx-${{ matrix.artifact }}
          path: out/
          if-no-files-found: error

  # Collects every platform's binary and opens a PR. Only runs when all four succeeded,
  # so the repo never holds a partial set.
  pull-request:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: librandomx-*
          path: artifacts

      - name: Place binaries
        run: |
          for dir in artifacts/librandomx-*; do
            platform="${dir#artifacts/librandomx-}"
            target="miner/src/main/resources/native/$platform"
            mkdir -p "$target"
            cp "$dir"/* "$target/"
          done
          find miner/src/main/resources/native -type f | sort

      # Pinned to a commit, not a tag: this action can write to the repo, and a mutable
      # tag could be repointed at any commit by its owner.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: randomx/${{ inputs.tag }}
          title: 'feat: randomx ${{ inputs.tag }} binaries'
          commit-message: 'feat: randomx ${{ inputs.tag }} binaries'
          body: |
            Built from [tevador/RandomX ${{ inputs.tag }}](https://github.com/tevador/RandomX/releases/tag/${{ inputs.tag }})
            by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Each platform passed the same checks before upload:
            - all 11 symbols the binding resolves are exported
            - upstream's `randomx-tests` passed against the official vectors

            Per-binary provenance, including commit and SHA-256, is in each
            `PROVENANCE.txt`. Run `./gradlew :miner:test` to confirm the vectors
            reproduce through the binding.
          delete-branch: true
